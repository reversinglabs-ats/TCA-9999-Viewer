<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReversingLabs TCA-9999 | {% block title %}{% endblock %}</title>
  <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="app">

  <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="{{ url_for('static', filename='images/rl_short.svg') }}" alt="ReversingLabs" class="logo-mark" />
      <div>
        <div class="logo-text">TCA-9999</div>
        <div class="logo-sub">Customer Usage API</div>
      </div>
    </div>

    <a class="nav-item{% if page == 'dashboard' %} active{% endif %}" href="{{ url_for('index') }}">
      <i class="bi bi-bar-chart"></i>
      Dashboard
    </a>

    <a class="nav-item{% if page == 'users' %} active{% endif %}" href="{{ url_for('users_page') }}">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1h8zm-7.978-1A.261.261 0 017 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002H7.022zM11 7a2 2 0 100-4 2 2 0 000 4zm3-2a3 3 0 11-6 0 3 3 0 016 0zM6.936 9.28a5.88 5.88 0 00-1.23-.247A7.35 7.35 0 005 9c-4 0-5 3-5 4 0 .667.333 1 1 1h4.216A2.238 2.238 0 015 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816zM4.92 10A5.493 5.493 0 004 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275zM1.5 5.5a3 3 0 116 0 3 3 0 01-6 0zm3-2a2 2 0 100 4 2 2 0 000-4z"/></svg>
      Users
    </a>
    <a class="nav-item{% if page == 'licenses' %} active{% endif %}" href="{{ url_for('licenses_page') }}">
      <i class="bi bi-file-earmark-medical"></i>
      Licenses
    </a>

    <a class="nav-item{% if page == 'settings' %} active{% endif %}" href="{{ url_for('settings_page') }}">
      <i class="bi bi-gear"></i>
      Settings
    </a>

    <div class="sidebar-footer"></div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">{% block topbar %}{% endblock %}</div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
